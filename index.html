<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aufgaben-Würfel</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --accent: #2f6fdb; --accent-text: #ffffff; --border: #e2ddd2; --done: #2e9d5b;
    --die: #ffffff; --pip: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --card: #212226; --text: #ececee; --muted: #9a9aa2;
      --accent: #5b8ff0; --accent-text: #0e0f12; --border: #33343a; --done: #4cc47f;
      --die: #f1f1f3; --pip: #16171a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  .sub { margin: 0 0 24px; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
  .die { width: 110px; height: 110px; background: var(--die); border-radius: 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18), inset 0 -6px 0 rgba(0,0,0,.08);
    display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 16px; }
  .pip { width: 18px; height: 18px; border-radius: 50%; background: var(--pip); place-self: center; visibility: hidden; }
  .pip.on { visibility: visible; }
  .die.rolling { animation: roll .6s ease-in-out infinite; }
  @keyframes roll { 0%{transform:rotate(0) scale(1)} 25%{transform:rotate(90deg) scale(.9)} 50%{transform:rotate(180deg) scale(1.05)} 75%{transform:rotate(270deg) scale(.9)} 100%{transform:rotate(360deg) scale(1)} }

  .btn { font: inherit; font-weight: 600; border: 0; border-radius: 999px; cursor: pointer; padding: 10px 18px;
    background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border: 0; font-size: 1.2rem; padding: 14px 36px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .result { min-height: 4.5em; }
  .result .thema { color: var(--muted); font-size: .9rem; text-transform: uppercase; letter-spacing: .05em; }
  .result .titel { font-size: 1.35rem; font-weight: 700; }
  .result.shuffling .titel { opacity: .5; }
  .hint { color: var(--muted); font-size: .9rem; }

  h2 { font-size: 1.1rem; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px 0; border-top: 1px solid var(--border); }
  li:first-child { border-top: 0; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  .tag { color: var(--muted); font-size: .85rem; }
  .progress { color: var(--done); font-weight: 600; font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>🎲 Aufgaben-Würfel</h1>
  <p class="sub">Technischer Betriebswirt – würfeln statt diskutieren.</p>

  <div class="card controls">
    <label>Thema
      <select id="thema"></select>
    </label>
    <label><input type="checkbox" id="skipDone" checked> Erledigte nicht mehr würfeln</label>
  </div>

  <div class="card stage">
    <div class="die" id="die"></div>
    <button class="btn primary" id="roll">Würfeln</button>
    <div class="result" id="result"><div class="hint">Drück auf „Würfeln“.</div></div>
    <button class="btn" id="markDone" hidden>✓ Als erledigt markieren</button>
  </div>

  <div class="card">
    <h2>Alle Aufgaben <span class="progress" id="progress"></span></h2>
    <ul id="list"></ul>
    <p style="margin:16px 0 0"><button class="btn" id="reset">Erledigt-Status zurücksetzen</button></p>
  </div>
</main>

<script>
// ===== HIER DIE AUFGABEN EINTRAGEN =====
// reihe("DBR", 10) ergibt DBR-1 bis DBR-10.
// Kommen Aufgaben dazu, einfach die Zahl erhöhen.

const reihe = (kuerzel, anzahl) => Array.from({ length: anzahl }, (_, i) => `${kuerzel}-${i + 1}`);

const BEREICHE = {
  "Deckungsbeitragsrechnung":        reihe("DBR", 10),
  "Plankostenrechnung":              reihe("PKR", 10),
  "Gemeinkostenzuschlagsrechnung":   reihe("GKZ", 6),
  "Maschinenstundensatzrechnung":    reihe("MSZ", 10),
  "Bilanzansatz":                    reihe("BilAn", 3),
  "Lagerbestandsrechnung":           reihe("MBLBR", 7),
  "Bedarfsrechnung":                 reihe("BR", 3),
  "Kapazitätswirtschaft":            reihe("KW", 3),
  "Außenfinanzierung":               reihe("AF", 5),
  "Kostenvergleichsrechnung":        reihe("KVR", 5),
  "Dynamische Investitionsrechnung": reihe("DIR", 8),
};

const AUFGABEN = Object.entries(BEREICHE).flatMap(([thema, liste]) => liste.map(titel => ({ thema, titel })));

// ===== AB HIER NICHTS ÄNDERN =====
  const STORE = "aufgaben-wuerfel-erledigt";
  const PIPS = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] };
  const key = a => a.thema + "|" + a.titel;

  const $ = id => document.getElementById(id);
  const dieEl = $("die"), resultEl = $("result"), rollBtn = $("roll"), doneBtn = $("markDone");
  let erledigt = new Set(), aktuell = null, letzte = null;

  try { erledigt = new Set(JSON.parse(localStorage.getItem(STORE)) || []); } catch {}
  const speichern = () => { try { localStorage.setItem(STORE, JSON.stringify([...erledigt])); } catch {} };

  for (let i = 0; i < 9; i++) dieEl.appendChild(Object.assign(document.createElement("div"), { className: "pip" }));
  const zeigeAugen = n => [...dieEl.children].forEach((p, i) => p.classList.toggle("on", PIPS[n].includes(i)));
  zeigeAugen(6);

  const themen = [...new Set(AUFGABEN.map(a => a.thema))];
  $("thema").innerHTML = '<option value="">Alle Themen</option>' + themen.map(t => `<option>${t}</option>`).join("");

  function kandidaten() {
    const t = $("thema").value;
    return AUFGABEN.filter(a => (!t || a.thema === t) && !($("skipDone").checked && erledigt.has(key(a))));
  }

  function zeigeErgebnis(a, shuffling) {
    resultEl.classList.toggle("shuffling", shuffling);
    resultEl.innerHTML = `<div class="thema">${a.thema}</div><div class="titel">${a.titel}</div>`;
  }

  function wuerfeln() {
    let pool = kandidaten();
    if (!pool.length) {
      resultEl.innerHTML = '<div class="hint">Keine offenen Aufgaben mehr 🎉 – Filter ändern oder zurücksetzen.</div>';
      doneBtn.hidden = true; return;
    }
    if (pool.length > 1) pool = pool.filter(a => a !== letzte); // nicht zweimal dieselbe hintereinander
    const ziel = pool[Math.floor(Math.random() * pool.length)];

    rollBtn.disabled = true; doneBtn.hidden = true;
    dieEl.classList.add("rolling");
    const start = Date.now();
    const tick = setInterval(() => {
      zeigeAugen(1 + Math.floor(Math.random() * 6));
      zeigeErgebnis(pool[Math.floor(Math.random() * pool.length)], true);
      if (Date.now() - start > 1200) {
        clearInterval(tick);
        dieEl.classList.remove("rolling");
        zeigeAugen(1 + Math.floor(Math.random() * 6));
        zeigeErgebnis(ziel, false);
        aktuell = letzte = ziel;
        rollBtn.disabled = false; doneBtn.hidden = false;
      }
    }, 80);
  }

  function renderListe() {
    $("list").innerHTML = "";
    AUFGABEN.forEach(a => {
      const li = document.createElement("li");
      li.className = erledigt.has(key(a)) ? "done" : "";
      li.innerHTML = `<label><input type="checkbox" ${erledigt.has(key(a)) ? "checked" : ""}> <span>${a.titel}</span> <em class="tag">${a.thema}</em></label>`;
      li.querySelector("input").onchange = e => { e.target.checked ? erledigt.add(key(a)) : erledigt.delete(key(a)); speichern(); renderListe(); };
      $("list").appendChild(li);
    });
    const n = AUFGABEN.filter(a => erledigt.has(key(a))).length;
    $("progress").textContent = `${n} / ${AUFGABEN.length} erledigt`;
  }

  rollBtn.onclick = wuerfeln;
  doneBtn.onclick = () => { if (aktuell) { erledigt.add(key(aktuell)); speichern(); renderListe(); doneBtn.hidden = true; } };
  $("reset").onclick = () => { if (confirm("Alle Aufgaben wieder als offen markieren?")) { erledigt.clear(); speichern(); renderListe(); } };
  renderListe();
</script>
</body>
</html>
